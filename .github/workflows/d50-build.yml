name: D50 test build

on:
  push:
    branches: [ci-d50-public]
  workflow_dispatch:
    inputs:
      ref:
        description: D50 branch to build
        default: xunison-exigo-d50-pcie-nobrst
      imagebuilder:
        description: Also build the Image Builder (yes/no)
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget ccache

      - name: Check out CI files
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out the D50 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}
          path: src

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ hashFiles('src/target/linux/generic/kernel-6.18', 'src/feeds.conf.default') }}
          restore-keys: dl-

      - name: Feeds
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci modemmanager luci-proto-modemmanager sms-tool luci-proto-mbim mbim-utils

      - name: Configure
        working-directory: src
        run: |
          cp ../ci/ci/seed.config .config
          case "${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}" in
            *pcie*) ;;
            *) echo CONFIG_PACKAGE_uqmi=y >> .config ;;
          esac
          echo CONFIG_BUILD_LOG=y >> .config
          if [ "${{ inputs.imagebuilder }}" = "yes" ]; then echo CONFIG_IB=y >> .config; fi
          make defconfig
          case "${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}" in
            *pcie*) modem="kmod-mhi-pci-generic kmod-mhi-wwan-ctrl kmod-mhi-wwan-mbim umbim" ;;
            *) modem="kmod-usb-net-qmi-wwan kmod-usb-serial-option uqmi" ;;
          esac
          for p in kmod-ath11k-pci ath11k-firmware-qcn9074 $modem luci; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "missing $p"; exit 1; }
          done
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xunison_exigo-hub-d50-5g=y' .config

      - name: Download sources
        working-directory: src
        run: make download -j8

      - name: Build
        working-directory: src
        run: |
          echo "start $(date -u)"
          if ! make -j$(($(nproc)+1)); then
            set -o pipefail
            make -j1 V=s 2>&1 | tail -300
            exit 1
          fi
          echo "end $(date -u)"
          ls -la bin/targets/qualcommax/ipq50xx/

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: d50-images-${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}
          path: |
            src/bin/targets/qualcommax/ipq50xx/*xunison_exigo-hub-d50-5g*
            src/bin/targets/qualcommax/ipq50xx/sha256sums
            src/bin/targets/qualcommax/ipq50xx/config.buildinfo
            src/bin/targets/qualcommax/ipq50xx/*.manifest
          retention-days: 30

      - name: Upload Image Builder
        if: success() && inputs.imagebuilder == 'yes'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: d50-imagebuilder-${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}
          path: src/bin/targets/qualcommax/ipq50xx/openwrt-imagebuilder-*
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d50-build-logs-${{ inputs.ref || 'xunison-exigo-d50-pcie-nobrst' }}
          path: src/logs/
          retention-days: 14
